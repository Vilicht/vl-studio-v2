name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.3.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Validasi struktur project
        run: |
          [ -f settings.gradle.kts ] || [ -f settings.gradle ] || { echo "::error::settings.gradle(.kts) tidak ditemukan di root repo."; exit 1; }
          [ -d app ] || { echo "::error::Folder app/ tidak ditemukan di root repo."; exit 1; }

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Siapkan debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx4g > build.log 2>&1 || (
            echo "=== DAFTAR ERROR KOTLIN ==="
            grep -E "^e: |Unresolved|mismatch|No value passed|Overload" build.log || tail -n 60 build.log
            exit 1
          )

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vilicht-live-studio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
